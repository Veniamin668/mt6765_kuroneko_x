name: build kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Debian 9 - идеальный баланс старых либ и поддержки git
      image: debian:9 
    
    steps:
      - name: Manual Checkout
        run: |
          # Ставим git вручную
          echo "deb http://archive.debian.org/debian/ stretch main" > /etc/apt/sources.list
          apt-get update
          apt-get install -y git
          
          # Клонируем руками
          git clone --depth=1 ${{ github.server_url }}/${{ github.repository }} .
          git checkout ${{ github.sha }}

      - name: Prepare Environment
        run: |
          # Убираем проверку срока действия
          echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99-ignore-valid-until
          
          apt-get install -y --no-install-recommends \
            build-essential bc bison flex cpio python libssl-dev \
            wget zip gcc-aarch64-linux-gnu gcc-arm-none-eabi libelf-dev
            
          chmod +x ./tools/dct/DrvGen.py

      - name: Build Kernel
        run: |
          sed -i 's/#define BUILD_BUG() BUILD_BUG_ON_MSG(1, "BUILD_BUG failed")/#define BUILD_BUG() do { } while (0)/g' include/linux/build_bug.h
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-none-eabi-
          
          make clean && make mrproper
          make akx_extreme_defconfig
          sed -i 's/CONFIG_FORTIFY_SOURCE=y/CONFIG_FORTIFY_SOURCE=n/g' .config
          
          make -j$(nproc) \
            KBUILD_CFLAGS='-D__compiletime_error= -w -Wno-error -Wno-attribute-warning -fno-strict-aliasing -fno-stack-protector -std=gnu89' \
            HOSTCFLAGS='-w -Wno-error'

      - name: Package
        run: |
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../KuroNeko-Extreme-$(date +%d%m%y).zip *

      # Если upload-artifact тоже упадет (он на Node), 
      # придется заливать через curl, но попробуй сначала так.
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KuroNeko-Extreme-Kernel
          path: KuroNeko-Extreme-*.zip
