name: Build KuroNeko Extreme Kernel

on:
  workflow_dispatch:

jobs:
  build:
    # Используем стандартный раннер, где есть Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Устанавливаем Nix в стандартный раннер
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

        - name: Build with Nix
        run: |
          # Включаем экспериментальные фичи Nix
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf

          # Используем gcc11 вместо gcc10
          nix-shell -p \
            gcc11 \
            gcc-arm-embedded \
            gnumake bc bison flex libssl_1_1 ncurses cpio python3 wget \
            --run "
              # Твои патчи
              sed -i 's/BUILD_BUG();/\/* BUILD_BUG(); *\//g' arch/arm64/include/asm/percpu.h

              # Сборка
              export ARCH=arm64
              export CROSS_COMPILE=aarch64-none-elf-
              export CROSS_COMPILE_ARM32=arm-none-eabi-
              
              make clean && make mrproper
              make akx_extreme_defconfig
              make olddefconfig
              
              make -j$(nproc) KBUILD_CFLAGS='-w -Wno-error' HOSTCFLAGS='-w -Wno-error'
            "


      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroNeko-Extreme-Artifact
          path: arch/arm64/boot/Image.gz-dtb

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "KuroNeko-v${{ github.run_id }}"
          files: arch/arm64/boot/Image.gz-dtb
