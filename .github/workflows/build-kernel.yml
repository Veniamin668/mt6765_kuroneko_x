name: Build KuroNeko Extreme Kernel (Arch)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          # Обновляем ключи и базы данных
          pacman -Syu --noconfirm
          # Ставим всё необходимое для сборки
          pacman -S --noconfirm base-devel aarch64-linux-gnu-gcc bc bison flex cpio python openssl wget

      - name: Build Kernel
        run: |
          # Твои патчи
          sed -i 's/BUILD_BUG();/\/* BUILD_BUG(); *\//g' arch/arm64/include/asm/percpu.h

          # Настройка окружения
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Очистка и конфигурация
          make clean && make mrproper
          make akx_extreme_defconfig
          make olddefconfig
          
          # Сборка
          make -j$(nproc) KBUILD_CFLAGS='-w -Wno-error' HOSTCFLAGS='-w -Wno-error'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroNeko-Extreme-Artifact
          path: arch/arm64/boot/Image.gz-dtb

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "KuroNeko-v${{ github.run_id }}"
          name: "KuroNeko Extreme Kernel Build"
          body: |
            ### 🥟 Автоматическая сборка ядра KuroNeko Extreme
            * **Особенности:** Вшит KernelSU-Next (Legacy) без gki.
            * **Окружение:** Arch Linux Container.
          files: arch/arm64/boot/Image.gz-dtb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
