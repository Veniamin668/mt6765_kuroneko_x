name: build kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:8

    steps:
      - name: Prepare Legacy Environment
        run: |
          # 1. Репозитории
          echo "deb http://archive.debian.org/debian/ jessie main" > /etc/apt/sources.list
          echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99-ignore-valid-until
          apt-get update -o Acquire::AllowInsecureRepositories=true
          
          # 2. Базовый софт (без кросс-компиляторов, их ставим руками)
          apt-get install -y --no-install-recommends \
            build-essential bc bison flex cpio python libssl-dev wget zip git
          
          # 3. Клонирование
          git clone --depth=1 https://github.com/${{ github.repository }} mt6765_kuroneko_x
          cd mt6765_kuroneko_x
          
          # 4. Качаем тулчейн Linaro (он гарантированно работает на Debian 8)
          wget -q https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/aarch64-linux-gnu/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          wget -q https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-eabi/gcc-linaro-7.5.0-2019.12-x86_64_arm-eabi.tar.xz
          
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_arm-eabi.tar.xz
          
          # Экспортируем пути (они будут доступны в этом шаге, но для след. шагов сделаем иначе)
          echo "TOOLCHAIN_AARCH64=$(pwd)/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu/bin/aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "TOOLCHAIN_ARM=$(pwd)/gcc-linaro-7.5.0-2019.12-x86_64_arm-eabi/bin/arm-eabi-" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          cd mt6765_kuroneko_x
          # Нейтрализуем BUILD_BUG
          sed -i 's/#define BUILD_BUG() BUILD_BUG_ON_MSG(1, "BUILD_BUG failed")/#define BUILD_BUG() do { } while (0)/g' include/linux/build_bug.h
          
          # Настройка окружения с нашими скачанными тулчейнами
          export ARCH=arm64
          export CROSS_COMPILE=${{ env.TOOLCHAIN_AARCH64 }}
          export CROSS_COMPILE_ARM32=${{ env.TOOLCHAIN_ARM }}
          
          make clean && make mrproper
          make akx_extreme_defconfig

          # Отключаем FORTIFY_SOURCE
          sed -i 's/CONFIG_FORTIFY_SOURCE=y/CONFIG_FORTIFY_SOURCE=n/g' .config
          
          # СОБИРАЕМ
          make -j$(nproc) \
            KBUILD_CFLAGS='-D__compiletime_error= -w -Wno-error -Wno-attribute-warning -fno-strict-aliasing -fno-stack-protector -std=gnu89' \
            HOSTCFLAGS='-w -Wno-error'

      - name: Package with AnyKernel3
        run: |
          cd mt6765_kuroneko_x
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../KuroNeko-Extreme-$(date +%d%m%y).zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroNeko-Extreme-Kernel
          path: mt6765_kuroneko_x/KuroNeko-Extreme-*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "KuroNeko-v${{ github.run_id }}"
          name: "KuroNeko Extreme Kernel Build (Debian 8)"
          body: |
            ### 🥟 Автоматическая сборка ядра KuroNeko Extreme
            * **Особенности:** Вшит KernelSU-Next (Legacy) без gki.
            * **Окружение:** Debian 8 (Archive) Container.
            * **Пакет:** Flashable via AnyKernel3.
          files: mt6765_kuroneko_x/KuroNeko-Extreme-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
