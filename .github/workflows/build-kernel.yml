name: Build KuroNeko Extreme Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # Используем Debian 11 внутри контейнера — это "золотой стандарт" для ядер 2021-2023 годов
    container:
      image: debian:11
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Compilers and Dependencies
        run: |
          apt-get update
          # Добавляем python3 для работы скриптов MediaTek
          apt-get install -y bc build-essential libncurses5-dev libssl-dev xz-utils bison flex ccache \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libelf-dev \
            pkg-config \
            git \
            python3
      - name: Build Kernel Core
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Очистка
          make clean
          make mrproper
          
          # ИСПРАВЛЕНИЕ: Удаляем ТОЛЬКО «висячий» -Wno-, 
          # который заканчивается пробелом или концом строки.
          # Флаги вроде -Wno-trigraphs останутся нетронутыми!
          find . -name "Makefile*" -exec sed -i 's/-Wno-[[:space:]]*/ /g' {} +
          
          make akx_extreme_defconfig
          make olddefconfig
          
          # Запуск сборки
          make -j$(nproc)

      - name: Prepare Artifact for Release
        run: |
          mkdir -p release_output
          # Используем одно имя везде
          cp arch/arm64/boot/Image.gz-dtb release_output/KuroNeko-Extreme.gz-dtb

      - name: Upload to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KuroNeko-Extreme-Artifact
          path: release_output/KuroNeko-Extreme.gz-dtb # Имя совпадает!

      - name: Generate Release Tag
        id: tag
        run: echo "release_tag=KuroNeko-v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload and Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "KuroNeko Extreme Kernel Build"
          body: |
            ### 🥟 Автоматическая сборка ядра KuroNeko Extreme
            * **Особенности:** Вшит KernelSU-Next (Legacy) без gki.
            * **Окружение:** Debian 11 Container.
          files: release_output/KuroNeko-Extreme.gz-dtb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
