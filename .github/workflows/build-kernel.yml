name: build kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:11

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

#      - name: Prepare Legacy Environment
#        run: |
          # Перенаправляем репозитории на архив
#          sed -i 's/httpredir.debian.org/archive.debian.org/g' /etc/apt/sources.list
#          sed -i 's/deb.debian.org/archive.debian.org/g' /etc/apt/sources.list
#          sed -i 's/security.debian.org/archive.debian.org\/debian-security/g' /etc/apt/sources.list
          
          # Отключаем проверку срока действия пакетов (они просрочены)
#          echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99-ignore-valid-until
#          
      - name: install dependenses
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential bc bison flex cpio python libssl-dev \
            wget zip git gcc-aarch64-linux-gnu gcc-arm-none-eabi

      - name: Build Kernel
        run: |
          # Нейтрализуем BUILD_BUG
          sed -i 's/#define BUILD_BUG() BUILD_BUG_ON_MSG(1, "BUILD_BUG failed")/#define BUILD_BUG() do { } while (0)/g' include/linux/build_bug.h
          
          # Настройка окружения
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-none-eabi-
          
          make clean && make mrproper
          make akx_extreme_defconfig

          # Отключаем FORTIFY_SOURCE (часто ломает старые ядра)
          sed -i 's/CONFIG_FORTIFY_SOURCE=y/CONFIG_FORTIFY_SOURCE=n/g' .config
          
          # СОБИРАЕМ
          # Если будет падать на системном GCC, здесь же можно добавить wget для скачивания старого Linaro
          make -j$(nproc) \
            KBUILD_CFLAGS='-D__compiletime_error= -w -Wno-error -Wno-attribute-warning -fno-strict-aliasing -fno-stack-protector -std=gnu89' \
            HOSTCFLAGS='-w -Wno-error'

      - name: Package with AnyKernel3
        run: |
          # Копируем ядро
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
          
          # Запаковываем
          cd AnyKernel3
          zip -r9 ../KuroNeko-Extreme-$(date +%d%m%y).zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroNeko-Extreme-Kernel
          path: KuroNeko-Extreme-*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "KuroNeko-v${{ github.run_id }}"
          name: "KuroNeko Extreme Kernel Build (Debian 8)"
          body: |
            ### 🥟 Автоматическая сборка ядра KuroNeko Extreme
            * **Особенности:** Вшит KernelSU-Next (Legacy) без gki.
            * **Окружение:** Debian 8 (Archive) Container.
            * **Пакет:** Flashable via AnyKernel3.
          files: KuroNeko-Extreme-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
