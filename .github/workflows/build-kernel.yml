name: Build KuroNeko Extreme Kernel (Arch)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel aarch64-linux-gnu-gcc arm-none-eabi-gcc bc bison flex cpio python openssl wget

      - name: Build Kernel
        run: |
          # Нейтрализуем BUILD_BUG
          sed -i 's/#define BUILD_BUG() BUILD_BUG_ON_MSG(1, "BUILD_BUG failed")/#define BUILD_BUG() do { } while (0)/g' include/linux/build_bug.h
          
          # Настройка окружения
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-none-eabi-
          
          make clean && make mrproper
          make akx_extreme_defconfig
          
          # Отключаем FORTIFY_SOURCE, так как он вызывает дополнительные проверки
          sed -i 's/CONFIG_FORTIFY_SOURCE=y/CONFIG_FORTIFY_SOURCE=n/g' .config
          
          # Собираем
          make -j$(nproc) \
            KBUILD_CFLAGS='-w -Wno-error -Wno-attribute-warning -fno-strict-aliasing -fno-stack-protector -std=gnu89' \
            HOSTCFLAGS='-w -Wno-error'
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroNeko-Extreme-Artifact
          path: arch/arm64/boot/Image.gz-dtb

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "KuroNeko-v${{ github.run_id }}"
          name: "KuroNeko Extreme Kernel Build"
          body: |
            ### 🥟 Автоматическая сборка ядра KuroNeko Extreme
            * **Особенности:** Вшит KernelSU-Next (Legacy) без gki.
            * **Окружение:** Arch Linux Container.
          files: arch/arm64/boot/Image.gz-dtb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
