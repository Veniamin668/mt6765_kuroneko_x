name: build kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Блок container полностью удален

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          # Все команды с sudo!
          sudo apt-get update 
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex cpio python3 libssl-dev \
            wget zip git libelf-dev ca-certificates
          
          # На всякий случай чистим конфиг git
          git config --global http.postBuffer 524288000
          
          # Клонируем тулчейны
          git clone --depth=1 https://github.com/mvaisakh/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.git toolchain-aarch64
          git clone --depth=1 https://github.com/mvaisakh/gcc-linaro-7.5.0-2019.12-x86_64_arm-eabi.git toolchain-arm
          
          # Экспортируем пути
          echo "TOOLCHAIN_AARCH64=$(pwd)/toolchain-aarch64/bin/aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "TOOLCHAIN_ARM=$(pwd)/toolchain-arm/bin/arm-eabi-" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          # Нейтрализуем BUILD_BUG
          sed -i 's/#define BUILD_BUG() BUILD_BUG_ON_MSG(1, "BUILD_BUG failed")/#define BUILD_BUG() do { } while (0)/g' include/linux/build_bug.h
          
          # Настройка окружения
          export ARCH=arm64
          export CROSS_COMPILE=${{ env.TOOLCHAIN_AARCH64 }}
          export CROSS_COMPILE_ARM32=${{ env.TOOLCHAIN_ARM }}
          
          make clean
          make akx_extreme_defconfig

          # Отключаем FORTIFY_SOURCE
          sed -i 's/CONFIG_FORTIFY_SOURCE=y/CONFIG_FORTIFY_SOURCE=n/g' .config
          
          # СОБИРАЕМ
          make -j$(nproc) \
            KBUILD_CFLAGS='-D__compiletime_error= -w -Wno-error -Wno-attribute-warning -fno-strict-aliasing -fno-stack-protector -std=gnu89' \
            HOSTCFLAGS='-w -Wno-error'

      - name: Package with AnyKernel3
        run: |
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../KuroNeko-Extreme-$(date +%d%m%y).zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroNeko-Extreme-Kernel
          path: KuroNeko-Extreme-*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "KuroNeko-v${{ github.run_id }}"
          name: "KuroNeko Extreme Kernel Build (Native Ubuntu)"
          body: |
            ### 🥟 Автоматическая сборка ядра KuroNeko Extreme
            * **Особенности:** Вшит KernelSU-Next (Legacy) без gki.
            * **Окружение:** Native GitHub Runner (Ubuntu) + Linaro 7.5.
            * **Пакет:** Flashable via AnyKernel3.
          files: KuroNeko-Extreme-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
