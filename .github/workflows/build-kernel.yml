name: build kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex cpio python3 libssl-dev \
            wget zip git libelf-dev ca-certificates \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
      
      - name: Purge stack-protector from Makefiles
        run: |
          find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-fstack-protector[a-zA-Z0-9-]*//g' {} +
          echo "Зачистка завершена. Флаги удалены из всех Makefile/Kbuild."
          
      - name: Build Kernel
        run: |
          sed -i 's/#define BUILD_BUG() BUILD_BUG_ON_MSG(1, "BUILD_BUG failed")/#define BUILD_BUG() do { } while (0)/g' include/linux/build_bug.h
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make akx_extreme_defconfig
          
          scripts/config --file .config -e IOMMU_SUPPORT -e ARM_SMMU -e ARM_SMMU_V3
          scripts/config --file .config -e MODULES -e MODULE_UNLOAD -d MODULE_SIG
          scripts/config --file .config -d STACKPROTECTOR -d STACKPROTECTOR_STRONG -d FORTIFY_SOURCE
          
          make olddefconfig
          
          # Патчи путей для GPU (теперь с полными путями к файлам)
          sed -i 's/lsetloop:/1:/g' drivers/misc/mediatek/gpu/gpu_rgx/m1.11ED5425693/services/server/env/linux/osfunc_arm64.c
          sed -i 's/swayloop:/2:/g' drivers/misc/mediatek/gpu/gpu_rgx/m1.11ED5425693/services/server/env/linux/osfunc_arm64.c
          
          # Чиним переходы ассемблера
          sed -i 's/b.ge 1/b.ge 1b/g' drivers/misc/mediatek/gpu/gpu_rgx/m1.11ED5425693/services/server/env/linux/osfunc_arm64.c
          sed -i 's/b.ge 2/b.ge 2b/g' drivers/misc/mediatek/gpu/gpu_rgx/m1.11ED5425693/services/server/env/linux/osfunc_arm64.c

          export KBUILD_CFLAGS="$KBUILD_CFLAGS -fno-stack-protector"
          
          # СОБИРАЕМ
          make -j$(nproc) \
            KBUILD_CFLAGS='-w -Wno-error -std=gnu89 -fno-strict-aliasing' \
            HOSTCFLAGS='-w -Wno-error'
            
      - name: Package with AnyKernel3
        run: |
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../KuroNeko-Extreme-$(date +%d%m%y).zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroNeko-Extreme-Kernel
          path: KuroNeko-Extreme-*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "KuroNeko-v${{ github.run_id }}"
          name: "KuroNeko Extreme Kernel Build (Ubuntu 22.04 + System GCC)"
          body: |
            ### 🥟 Автоматическая сборка ядра KuroNeko Extreme
            * **Особенности:** Вшит KernelSU-Next (Legacy) без gki.
            * **Окружение:** Ubuntu 22.04 + System Toolchain (gcc-aarch64/arm-gnueabi).
            * **Пакет:** Flashable via AnyKernel3.
          files: KuroNeko-Extreme-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
