name: build kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:8

    steps:
      - name: Prepare Legacy Environment
        run: |
          # Чистим старый конфиг и прописываем только живое зеркало
          echo "deb http://archive.debian.org/debian/ jessie main" > /etc/apt/sources.list
          
          # Отключаем проверки, которые ломают старый Debian
          echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99-ignore-valid-until
          echo "Acquire::AllowInsecureRepositories \"true\";" >> /etc/apt/apt.conf.d/99-ignore-valid-until
          echo "Acquire::AllowDowngradeToInsecureRepositories \"true\";" >> /etc/apt/apt.conf.d/99-ignore-valid-until
          
          # Обновляемся с флагами игнорирования ошибок
          apt-get update -o Acquire::AllowInsecureRepositories=true
          
          # Ставим git и нужные инструменты
          apt-get install -y --no-install-recommends \
            build-essential bc bison flex cpio python libssl-dev \
            wget zip git gcc-aarch64-linux-gnu gcc-arm-none-eabi

          # Клонируем исходники
          git clone --depth=1 https://github.com/${{ github.repository }} mt6765_kuroneko_x
          cd mt6765_kuroneko_x

      - name: Build Kernel
        run: |
          cd mt6765_kuroneko_x
          # Нейтрализуем BUILD_BUG
          sed -i 's/#define BUILD_BUG() BUILD_BUG_ON_MSG(1, "BUILD_BUG failed")/#define BUILD_BUG() do { } while (0)/g' include/linux/build_bug.h
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-none-eabi-
          
          make clean && make mrproper
          make akx_extreme_defconfig

          # Отключаем FORTIFY_SOURCE
          sed -i 's/CONFIG_FORTIFY_SOURCE=y/CONFIG_FORTIFY_SOURCE=n/g' .config
          
          # СОБИРАЕМ
          make -j$(nproc) \
            KBUILD_CFLAGS='-D__compiletime_error= -w -Wno-error -Wno-attribute-warning -fno-strict-aliasing -fno-stack-protector -std=gnu89' \
            HOSTCFLAGS='-w -Wno-error'

      - name: Package with AnyKernel3
        run: |
          cd mt6765_kuroneko_x
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../KuroNeko-Extreme-$(date +%d%m%y).zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroNeko-Extreme-Kernel
          path: mt6765_kuroneko_x/KuroNeko-Extreme-*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "KuroNeko-v${{ github.run_id }}"
          name: "KuroNeko Extreme Kernel Build (Debian 8)"
          body: |
            ### 🥟 Автоматическая сборка ядра KuroNeko Extreme
            * **Особенности:** Вшит KernelSU-Next (Legacy) без gki.
            * **Окружение:** Debian 8 (Archive) Container.
            * **Пакет:** Flashable via AnyKernel3.
          files: mt6765_kuroneko_x/KuroNeko-Extreme-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
