name: Ubuntu slim Host machine builder

on:
  workflow_dispatch:

jobs:
  overkill:
    runs-on: ubuntu-22.04-arm
    container: debian:11
    timeout-minutes: 360

    steps:
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main
      
      - name: Setup environment and GCC toolchain
        run: |
          # Прописываем строго HTTP репозитории без HTTPS (чтобы ca-certificates не мешали)
          echo "deb http://debian.org bullseye main" > /etc/apt/sources.list
          echo "deb http://debian.org bullseye-updates main" >> /etc/apt/sources.list
          echo "deb http://debian.org bullseye-security main" >> /etc/apt/sources.list
          
          # Отключаем ВСЕ проверки SSL-сертификатов и подписей для apt на корню
          apt-get update -y \
            -o Acquire::https::Verify-Peer=false \
            -o Acquire::https::Verify-Host=false \
            -o Acquire::Check-Valid-Until=false \
            --allow-unauthenticated
          
          # Накатываем ca-certificates и базовый тулчейн, полностью забив на сертификаты
          apt-get install -y --allow-unauthenticated \
            -o Acquire::https::Verify-Peer=false \
            -o Acquire::https::Verify-Host=false \
            ca-certificates bc bison build-essential ccache flex libssl-dev libelf-dev python3 git wget \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi
                                  
      - name: Enable KVM hardware acceleration
        env:
          PASSWORD: ${{ secrets.ADMIN_PASS }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | tee /etc/udev/rules.d/99-kvm4all.rules
          udevadm control --reload-rules && sudo udevadm trigger
          usermod -aG kvm $USER
          # Задаем пароль для нативного юзера 'runner'
          echo "runner:$PASSWORD" | chpasswd

      # 1. Скачиваем репозиторий с твоим docker-compose.yml
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Коннектимся к Tailscale по твоему ключу tskey-...
      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAIL_KEY }}
          hostname: kuroneko-builder
          
      - name: вечный затык
        run: |
          # Железобетонный вечный затык
          tail -f /dev/null
