name: Ubuntu slim Host machine builder

on:
  workflow_dispatch:

jobs:
  overkill:
    runs-on: ubuntu-22.04-arm
    container: debian:11
    timeout-minutes: 360

    steps:
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Setup environment and GCC toolchain
        run: |
          # Прописываем только живой архив Debian 11, без выебонов с несуществующим security
          echo "deb http://archive.debian.org/debian bullseye main" > /etc/apt/sources.list
          echo "deb http://archive.debian.org/debian bullseye-updates main" >> /etc/apt/sources.list
          
          # Отключаем панику из-за просроченных ключей старого архива
          apt-get update -o Acquire::Check-Valid-Until=false
          
          # Накатываем тулчейн
          apt-get install -y --allow-unauthenticated sudo bc bison build-essential ccache flex libssl-dev libelf-dev python3 git wget \
                             gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi

                                  
      - name: Enable KVM hardware acceleration
        env:
          PASSWORD: ${{ secrets.ADMIN_PASS }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | tee /etc/udev/rules.d/99-kvm4all.rules
          udevadm control --reload-rules && sudo udevadm trigger
          usermod -aG kvm $USER
          # Задаем пароль для нативного юзера 'runner'
          echo "runner:$PASSWORD" | chpasswd

      # 1. Скачиваем репозиторий с твоим docker-compose.yml
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Коннектимся к Tailscale по твоему ключу tskey-...
      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAIL_KEY }}
          hostname: kuroneko-builder
          
      - name: вечный затык
        run: |
          # Железобетонный вечный затык
          tail -f /dev/null
